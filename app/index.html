<html lang="en">
  <head>
    <title>Enchiridion</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#fcfcfb"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1a19"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <!-- "default" keeps the iOS status bar opaque so web content renders below it
      (no Dynamic Island overlap, no dead top gap). The per-scheme theme-color
      tags above tint the bar to match light/dark. Switching to
      "black-translucent" would require safe-area-inset-top padding on every
      top-of-screen surface and forces white status-bar glyphs (unreadable over
      the near-white light theme), so we intentionally avoid it. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="apple-mobile-web-app-title"
      content="Enchiridion"
    />
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/splash-light.png"
    />
    <link
      rel="apple-touch-startup-image"
      media="(prefers-color-scheme: dark) and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
